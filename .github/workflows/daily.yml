name: KIH Daily News Bot

on:
  # 외부 cron 서비스(cron-job.org)가 GitHub API의 workflow_dispatch를 호출.
  # GitHub Actions 자체 cron은 무료 tier 누락이 잦아 사용하지 않음.
  workflow_dispatch: {}

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 락 파일 commit/push 용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          # ----- 공통: 뉴스 수집 / AI 처리 -----
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # ----- 채널 토글 (Secrets 또는 vars 사용 가능) -----
          # 값이 비어 있으면 main.py 기본값(KAKAO=true, 나머지 false) 적용
          ENABLE_KAKAO: ${{ vars.ENABLE_KAKAO || secrets.ENABLE_KAKAO || 'true' }}
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL || secrets.ENABLE_EMAIL || 'false' }}
          ENABLE_TELEGRAM: ${{ vars.ENABLE_TELEGRAM || secrets.ENABLE_TELEGRAM || 'false' }}

          # ----- KakaoTalk (기존 로직) -----
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}

          # ----- Email (신규) -----
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'KIH News Bot' }}
          EMAIL_DELIVERY_MODE: ${{ vars.EMAIL_DELIVERY_MODE || 'to' }}  # to | bcc | individual

          # ----- Telegram (신규) -----
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

          PYTHONIOENCODING: utf-8
        run: python src/main.py

      - name: Commit lock file if updated
        if: always()
        run: |
          if [ -f .last_send.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .last_send.json
            git diff --cached --quiet || git commit -m "chore: update lock file [skip ci]"
            git push || echo "[WARN] Lock file push failed (likely concurrent run)"
          else
            echo "No lock file to commit (slot was 'manual' or first run)."
          fi
