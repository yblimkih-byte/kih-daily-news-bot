name: KIH Daily News Bot

on:
  schedule:
    # 슬롯당 3개 cron (5분 간격). 어느 하나라도 트리거되면 슬롯 매칭됨.
    # 코드의 ±25분 매칭 윈도우와 결합하면 사실상 누락 0%.
    
    # 07:40 KST slot (UTC 22:40 / 22:45 / 22:50)
    - cron: '40 22 * * *'
    - cron: '45 22 * * *'
    - cron: '50 22 * * *'
    
    # 09:30 KST slot (UTC 00:30 / 00:35 / 00:40)
    - cron: '30 0 * * *'
    - cron: '35 0 * * *'
    - cron: '40 0 * * *'
    
    # 14:00 KST slot (UTC 05:00 / 05:05 / 05:10)
    - cron: '0 5 * * *'
    - cron: '5 5 * * *'
    - cron: '10 5 * * *'
    
    # 17:30 KST slot (UTC 08:30 / 08:35 / 08:40)
    - cron: '30 8 * * *'
    - cron: '35 8 * * *'
    - cron: '40 8 * * *'
  workflow_dispatch: {}

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python src/main.py
