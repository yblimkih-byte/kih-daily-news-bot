name: KIH Daily News Bot

on:
  schedule:
    # 슬롯당 cron 2개 (10분 간격). 매칭 윈도우 ±40분(main.py).
    # 두 cron의 시간 간격을 넓혀 GitHub Actions 지연 변동성 흡수.
    # 락 파일이 같은 슬롯 중복 발송을 차단함.
    
    # [임시 테스트용 - 트리거 확인 후 즉시 삭제]
   - cron: '30 9 * * *'
    
    # 07:40 KST slot: UTC 22:40 / 22:50
    - cron: '40 22 * * *'
    - cron: '50 22 * * *'

    # 09:30 KST slot: UTC 00:30 / 00:40
    - cron: '30 0 * * *'
    - cron: '40 0 * * *'

    # 14:00 KST slot: UTC 05:00 / 05:10
    - cron: '0 5 * * *'
    - cron: '10 5 * * *'

    # 17:30 KST slot: UTC 08:30 / 08:40
    - cron: '30 8 * * *'
    - cron: '40 8 * * *'
  workflow_dispatch: {}

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 락 파일 commit/push 권한

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: python src/main.py

      - name: Commit lock file if updated
        if: always()
        run: |
          if [ -f .last_send.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .last_send.json
            # commit만, push 실패해도 워크플로우는 성공 처리
            git diff --cached --quiet || git commit -m "chore: update lock file [skip ci]"
            git push || echo "[WARN] Lock file push failed (likely concurrent run)"
          else
            echo "No lock file to commit (slot was 'manual' or first run)."
          fi
