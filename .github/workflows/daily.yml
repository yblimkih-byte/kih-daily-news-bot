name: KIH Daily News Bot

on:
  workflow_dispatch: {}

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # 락 파일 + 발송 이력 파일 commit/push 용

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news bot
        env:
          # ----- 공통: 뉴스 수집 / AI 처리 -----
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3-flash-preview' }}

          # ----- 채널 토글 -----
          ENABLE_KAKAO: ${{ vars.ENABLE_KAKAO || secrets.ENABLE_KAKAO || 'true' }}
          ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL || secrets.ENABLE_EMAIL || 'false' }}
          ENABLE_TELEGRAM: ${{ vars.ENABLE_TELEGRAM || secrets.ENABLE_TELEGRAM || 'false' }}

          # ----- KakaoTalk -----
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}

          # ----- Email -----
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'KIH News Bot' }}
          EMAIL_DELIVERY_MODE: ${{ vars.EMAIL_DELIVERY_MODE || 'to' }}

          # ----- Telegram -----
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

          # ----- Dedupe retention (days). Default 3. -----
          SENT_HISTORY_DAYS: ${{ vars.SENT_HISTORY_DAYS || '3' }}

          PYTHONIOENCODING: utf-8
        run: python src/main.py

      - name: Commit state files if updated
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          changes=0
          if [ -f .last_send.json ]; then
            git add .last_send.json
            changes=1
          fi
          if [ -f .sent_history.json ]; then
            git add .sent_history.json
            changes=1
          fi

          if [ "$changes" -eq 1 ]; then
            git diff --cached --quiet || git commit -m "chore: update state files [skip ci]"
            git push || echo "[WARN] State push failed (likely concurrent run)"
          else
            echo "No state files to commit."
          fi
